name: Release ClipNest desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and publish Version 1.34.2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.34.2'
          & ./desktop/build-release.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) { throw "Build $version failed." }
          $asset = "release-output/ClipNest-$version-Setup-x64.exe"
          if (-not (Test-Path $asset)) { throw "Missing asset $asset" }
          gh release create "v$version" $asset --repo $env:GITHUB_REPOSITORY --title "ClipNest Version $version" --notes-file "desktop/release-notes/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Publishing $version failed." }
