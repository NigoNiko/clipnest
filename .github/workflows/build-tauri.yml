name: Build ClipNest for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: outputs/clipnest-tauri-demo
        run: npm install

      - name: Build Windows installer
        working-directory: outputs/clipnest-tauri-demo
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipnest-windows-installer
          path: |
            outputs/clipnest-tauri-demo/src-tauri/target/release/bundle/nsis/*.exe
            outputs/clipnest-tauri-demo/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

